<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Yohanes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <div class="logo">Yohanes</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
      <button id="toggle-theme">🌞</button>
    </div>
  </nav>

  <section class="section">
    <h2>Let's Talk</h2>
    <form action="https://formspree.io/f/mnndngjz" method="POST" style="max-width: 500px; margin: auto;">
      <input type="text" name="name" placeholder="Your Name" required
        style="width: 100%; margin-bottom: 15px; padding: 10px;">
      <input type="email" name="email" placeholder="Your Email" required
        style="width: 100%; margin-bottom: 15px; padding: 10px;">
      <textarea name="message" placeholder="Your Message" required
        style="width: 100%; height: 150px; padding: 10px;"></textarea><br>
      <button type="submit"
        style="margin-top: 15px; background: var(--accent); color: white; padding: 10px 20px; border: none; border-radius: 10px;">Send
        Message</button>
    </form>
  </section>

  <footer>
    <p>Built with ❤️ by Yohanes Demissie | © 2025</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
